services:
  - type: web
    name: ajudaki
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # o SQLite do plano grátis não persiste: recria os dados de exemplo a cada início
    startCommand: python seed.py && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
