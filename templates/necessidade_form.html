{% extends "base.html" %}
{% block title %}Pedir ajuda{% endblock %}

{% block content %}
<h1 class="page-title">Pedir ajuda</h1>
<p class="page-intro">Conte do que você ou sua organização estão precisando.</p>

<form class="form" method="post">
    <label>
        Título
        <input type="text" name="title" required placeholder="Ex.: Aulas básicas de informática">
    </label>

    <label>
        Descrição
        <textarea name="description" rows="3"></textarea>
    </label>

    <label>
        Quantidade de horas
        <input type="number" name="hours" min="0.5" step="0.5" value="1" required>
    </label>

    <label>
        Habilidade relacionada
        <select name="skill_id">
            <option value="">Não especificada</option>
            {% for s in skills %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Município
        <select name="municipality_id" required>
            {% for m in municipios %}
            <option value="{{ m.id }}">{{ m.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Local
        <input type="text" name="location" placeholder="Ex.: Associação Esperança">
    </label>

    <p class="form-group-title">Quem está pedindo</p>
    <p class="hint">Preencha só uma das opções.</p>

    <label>
        Pessoa já cadastrada
        <select name="requester_user_id">
            <option value="">—</option>
            {% for p in pessoas %}
            <option value="{{ p.id }}">{{ p.public_name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Organização já cadastrada
        <select name="requester_organization_id">
            <option value="">—</option>
            {% for o in organizacoes %}
            <option value="{{ o.id }}">{{ o.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Ou nome do solicitante (ainda não cadastrado)
        <input type="text" name="requester_label" placeholder="Ex.: OSC Esperança">
    </label>

    <div class="form-actions">
        <a class="btn" href="{{ url_for('necessidades.list') }}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Publicar</button>
    </div>
</form>
{% endblock %}
