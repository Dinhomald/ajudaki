{% extends "base.html" %}
{% block title %}Registrar troca{% endblock %}

{% block content %}
<h1 class="page-title">Registrar troca</h1>
<p class="page-intro">Quem ajudou ganha as horas como crédito.</p>

{% if erro %}
<p class="error">{{ erro }}</p>
{% endif %}

<form class="form" method="post">
    <label>
        Quem ajudou
        <select name="provider_id" required>
            <option value="">Selecione</option>
            {% for p in pessoas %}
            <option value="{{ p.id }}">{{ p.public_name }}</option>
            {% endfor %}
        </select>
    </label>

    <p class="form-group-title">Quem recebeu a ajuda</p>
    <p class="hint">Escolha uma pessoa ou uma organização.</p>

    <label>
        Pessoa
        <select name="requester_user_id">
            <option value="">—</option>
            {% for p in pessoas %}
            <option value="{{ p.id }}">{{ p.public_name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Organização
        <select name="requester_organization_id">
            <option value="">—</option>
            {% for o in organizacoes %}
            <option value="{{ o.id }}">{{ o.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Pedido relacionado (opcional)
        <select name="need_id">
            <option value="">—</option>
            {% for n in necessidades_abertas %}
            <option value="{{ n.id }}">{{ n.title }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        Horas
        <input type="number" name="hours" min="0.5" step="0.5" value="1" required>
    </label>

    <label>
        Descrição
        <textarea name="description" rows="2"></textarea>
    </label>

    <div class="form-actions">
        <a class="btn" href="{{ url_for('trocas.list') }}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Registrar</button>
    </div>
</form>
{% endblock %}
